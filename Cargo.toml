[package]
name = "omastudio-engine"
version = "2.4.0"
edition = "2024"
rust-version = "1.99"
authors = ["Ozan Özdil"]
description = "High-performance Lightroom-grade RAW photo engine for Omarchy Linux"
license = "MIT"

[workspace]
members = [".", "app"]

[lib]
name = "omastudio_engine"
path = "src/lib.rs"

[[bin]]
name = "omastudio-engine"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
libc = "0.2"
lcms2 = "6.2"
nusb = "0.2.8"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
pollster = "1.0.1"

[build-dependencies]
pkg-config = "0.3"
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
