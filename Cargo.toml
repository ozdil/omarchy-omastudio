[package]
name = "omastudio-engine"
version = "3.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Ozan Özdil"]
description = "RAW development engine of OmaStudio, the complete medium format RAW editor for Omarchy"
license = "MIT"

[workspace]
members = [".", "app"]

[lib]
name = "omastudio_engine"
path = "src/lib.rs"

[[bin]]
name = "omastudio-engine"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "pnm", "exr", "hdr"] }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
exr = { version = "1.74", default-features = false }
libc = "0.2"
lcms2 = "6.2"
nusb = "0.2.8"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
pollster = "1.0.1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-20", "openvino", "qnn", "vitis", "cuda", "migraphx", "xnnpack", "webgpu"] }

[build-dependencies]
pkg-config = "0.3"
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
