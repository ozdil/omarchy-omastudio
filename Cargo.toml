[package]
name = "omastudio-engine"
version = "1.4.1"
edition = "2021"
authors = ["Ozan Özdil"]
description = "High-performance Lightroom-grade RAW photo engine for Omarchy Linux"
license = "MIT"

[lib]
name = "omastudio_engine"
path = "src/lib.rs"

[[bin]]
name = "omastudio-engine"
path = "src/main.rs"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
