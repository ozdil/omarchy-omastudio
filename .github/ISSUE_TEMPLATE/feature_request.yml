name: Feature request
description: Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do
      description: The task or workflow, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How OmaStudio could help. Mention the camera or file type if it matters.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you tried, or how other editors handle it.
