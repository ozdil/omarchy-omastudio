name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  # Arch Linux container so CI uses the same LibRaw, Qt and Rust packages as Omarchy.
  # rustup installs the toolchain pinned in rust-toolchain.toml.
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel clang git lcms2 libraw mold pkgconf rustup
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked

  clippy:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel clang git lcms2 libraw mold pkgconf rustup
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
