name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      # Same toolchain as rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang liblcms2-dev libraw-dev mold pkg-config qt6-base-dev qt6-declarative-dev
      - name: Build and package
        run: |
          # Ubuntu keeps qmake6 outside PATH
          export QMAKE=/usr/lib/qt6/bin/qmake6
          cargo build --release --locked --workspace
          version="${VERSION#v}"
          package="omastudio-$version-$ARCH-linux"
          mkdir -p "dist/$package/bin" "dist/$package/share/omastudio"
          install -m755 target/release/omastudio-engine "dist/$package/bin/omastudio-engine"
          install -m755 target/release/omastudio-app "dist/$package/bin/omastudio-app"
          install -m755 omastudio "dist/$package/bin/omastudio"
          install -m644 Panel.qml manifest.json "dist/$package/share/omastudio/"
          cp -r assets/icc skill "dist/$package/share/omastudio/"
          cp LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum ./*.tar.gz > checksums.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
