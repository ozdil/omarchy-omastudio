name: Release

on:
  push:
    tags: ['v*']
  # Builds the archive without publishing, to check a release before tagging it
  workflow_dispatch:

jobs:
  # Arch Linux container, like CI: the same LibRaw, Qt and Rust packages as Omarchy.
  # Omarchy and the PKGBUILD are x86_64 only.
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ github.ref_name }}
      ARCH: x86_64
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel clang git lcms2 libraw mold pkgconf qt6-base qt6-declarative rustup
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Build and package
        run: |
          cargo build --release --locked --workspace
          version="${VERSION#v}"
          package="omastudio-$version-$ARCH-linux"
          mkdir -p "dist/$package/bin" "dist/$package/share/omastudio"
          install -m755 target/release/omastudio-engine "dist/$package/bin/omastudio-engine"
          install -m755 target/release/omastudio-app "dist/$package/bin/omastudio-app"
          install -m755 omastudio "dist/$package/bin/omastudio"
          install -m644 Panel.qml manifest.json "dist/$package/share/omastudio/"
          cp -r assets/icc skill "dist/$package/share/omastudio/"
          cp LICENSE README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          "dist/$package/bin/omastudio-engine" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-x86_64
          path: dist/*.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      # Release notes: this version's section of CHANGELOG.md
      - run: awk -v h="## ${GITHUB_REF_NAME} " 'index($0, h) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum ./*.tar.gz > checksums.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/checksums.txt
