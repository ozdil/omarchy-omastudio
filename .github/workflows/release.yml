name: Release

on:
  push:
    tags: ['v*']
  # Builds the archive without publishing, to check a release before tagging it
  workflow_dispatch:

jobs:
  # Arch Linux container, like CI: the same LibRaw, Qt and Rust packages as Omarchy.
  # Omarchy and the PKGBUILD are x86_64 only.
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ github.ref_name }}
      ARCH: x86_64
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel clang git lcms2 libraw mold pkgconf qt6-base qt6-declarative qt6-tools python rustup
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # The tag must name the version in Cargo.toml, PKGBUILD and manifest.json,
      # and CHANGELOG.md must have its section (the release notes come from it).
      - name: Check version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            python3 tools/release/check-version.py "$GITHUB_REF_NAME"
          else
            python3 tools/release/check-version.py
          fi
      - name: Build and package
        run: |
          cargo build --release --locked --workspace
          version="${VERSION#v}"
          package="omastudio-$version-$ARCH-linux"
          mkdir -p "dist/$package/bin" "dist/$package/share/omastudio"
          install -m755 target/release/omastudio-engine "dist/$package/bin/omastudio-engine"
          install -m755 target/release/omastudio-app "dist/$package/bin/omastudio-app"
          install -m755 omastudio omastudio-dashboard omastudio-status "dist/$package/bin/"
          install -Dm644 -t "dist/$package/share/omastudio/omarchy-plugin" omarchy-plugin/Panel.qml omarchy-plugin/manifest.json
          cp -r assets/icc skill "dist/$package/share/omastudio/"
          install -Dm644 omastudio.desktop "dist/$package/share/applications/omastudio.desktop"
          install -Dm644 assets/icon.svg "dist/$package/share/icons/hicolor/scalable/apps/omastudio.svg"
          install -Dm644 assets/icon-mono.svg "dist/$package/share/icons/hicolor/scalable/apps/omastudio-mono.svg"
          install -Dm644 packaging/udev/70-omastudio-cameras.rules "dist/$package/lib/udev/rules.d/70-omastudio-cameras.rules"
          cp LICENSE README.md README.tr.md CHANGELOG.md "dist/$package/"
          cp -r docs "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          "dist/$package/bin/omastudio-engine" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-x86_64
          path: dist/*.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Release notes: this version's section of CHANGELOG.md ("## [X.Y.Z] - date")
      - name: Release notes
        run: |
          awk -v h="## [${GITHUB_REF_NAME#v}] " 'index($0, h) == 1 {on = 1; next} on && /^(## |\[[^]]+\]: )/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum ./*.tar.gz > checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/checksums.txt
