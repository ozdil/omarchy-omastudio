name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    # Weekly supply-chain audit every Monday at 06:30 UTC
    - cron: "30 6 * * 1"
  push:
    branches: [ "master" ]
  workflow_dispatch:

# Declare default permissions as empty; each job grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to upload results to the GitHub Security code-scanning dashboard.
      security-events: write
      # Needed to publish Scorecard results and enable the OSSF Scorecard badge.
      id-token: write
      # Needed to read repository metadata and workflow definitions.
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
