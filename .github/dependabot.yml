# Keeps the SHA-pinned GitHub Actions current; each update is a pull request that CI checks.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "CI:"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Deps:"
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]
