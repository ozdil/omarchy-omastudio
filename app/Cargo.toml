[package]
name = "omastudio-app"
version = "3.0.0"
edition = "2024"
rust-version = "1.99"
authors = ["Ozan Özdil"]
description = "OmaStudio desktop application (Qt 6 / QML) for Omarchy"
license = "MIT"

[[bin]]
name = "omastudio-app"
path = "src/main.rs"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }
