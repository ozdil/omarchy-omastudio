[General]
DisableDefaultImports=false
; All baseline QML warnings (MainWindow.qml, WatermarkOverlay.qml) are resolved; enforce zero warnings.
MaxWarnings=0

[Warnings]
; Compiled cxx-qt module (OmaStudio.Host) stays info in static lint until .qmltypes is wired via -I:
ImportFailure=info
MissingType=info
MissingProperty=info
UnresolvedType=info
UnqualifiedAccess=info
; Fail CI immediately on structural QML regressions (Qt 6.12 qqmljslogger.cpp keys):
DuplicatePropertyBinding=error
AliasCycle=error
InheritanceCycle=error
